[workspace]
members = [
    "adapters/gmail-rest",
    "adapters/vault",
    "adapters/store-sqlcipher",
    "adapters/sync-runtime",
    "adapters/token-broker-core",
    "apps/tersa",
    "crates/application",
    "crates/domain",
    "crates/keys",
    "crates/presentation",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91.1"
license = "MPL-2.0"
repository = "https://github.com/reasance/tersa.app"
authors = ["tersa.app contributors"]

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22.1"
cargo_metadata = "0.23.1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.3.4"
hmac = "=0.12.1"
hkdf = "=0.12.4"
# MIME, charsets, and encoded words for message display (full_encoding adds
# legacy charsets through encoding_rs).
mail-parser = { version = "=0.11.9", default-features = false, features = ["full_encoding"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["native-tls"] }
rusqlite = { version = "=0.39.0", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "0.10.9"
subtle = "2.6.1"
tersa-application = { path = "crates/application", version = "=0.0.0" }
tersa-domain = { path = "crates/domain", version = "=0.0.0" }
tersa-keys = { path = "crates/keys", version = "=0.0.0" }
tersa-presentation = { path = "crates/presentation", version = "=0.0.0" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "sync", "time"] }
# Grapheme clusters, to cap the marks stacked on one character in SafeText.
unicode-segmentation = "=1.13.3"
# Zero-width marks, to count every combining mark in a SafeText grapheme cluster.
unicode-width = "=0.2.2"
url = "2.5.8"
zeroize = "1.9.0"

[workspace.lints.rust]
# Adapters that need FFI deny-and-expect it per call site with a reason.
unsafe_code = "deny"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
exit = "warn"
impl_trait_in_params = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
multiple_inherent_impl = "warn"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
tests_outside_test_module = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
