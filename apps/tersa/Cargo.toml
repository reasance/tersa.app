[package]
name = "tersa"
description = "A privacy-first Gmail client for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "tersa"
path = "src/main.rs"

[dependencies]
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "std"] }
rustix = { workspace = true, features = ["fs", "termios"] }
serde.workspace = true
tersa-application.workspace = true
tersa-keys.workspace = true
tersa-presentation.workspace = true
tersa-store-sqlcipher = { path = "../../adapters/store-sqlcipher", version = "=0.0.0" }
tersa-sync-runtime = { path = "../../adapters/sync-runtime", version = "=0.0.0" }
tersa-vault = { path = "../../adapters/vault", version = "=0.0.0" }
tokio.workspace = true
unicode-width = "0.2.2"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
zeroize.workspace = true

[lints]
workspace = true
